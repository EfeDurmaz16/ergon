name: ErgonDemo
options:
  bundleIdPrefix: dev.efedurmaz
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
packages:
  Ergon:
    path: ../..
targets:
  ErgonDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ErgonDemoUITests
    dependencies:
      - target: ErgonDemo
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: ErgonDemo
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Verifies the created event."
  ErgonDemo:
    type: application
    platform: iOS
    sources:
      - path: ErgonDemo
    dependencies:
      - package: Ergon
        product: Ergon
      - package: Ergon
        product: ErgonTools
      - package: Ergon
        product: ErgonUI
    info:
      path: ErgonDemo/Info.plist
      properties:
        CFBundleDisplayName: Ergon
        UILaunchScreen: {}
        NSCalendarsFullAccessUsageDescription: "Ergon creates the calendar events you approve."
        NSRemindersFullAccessUsageDescription: "Ergon creates the reminders you approve."
        NSContactsUsageDescription: "Ergon looks up and adds contacts you ask for."
        NSLocationWhenInUseUsageDescription: "Ergon uses your location to find nearby places and travel times."
        NSAlarmKitUsageDescription: "Ergon schedules the alarms and timers you approve."
        # iOS has no public API for the Apple Notes app, so Ergon's notes are
        # plain text files in its Documents folder. These two keys surface that
        # folder in the Files app under On My iPhone, which is as close to an
        # OS-level home as notes can get.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
